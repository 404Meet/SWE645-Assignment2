# Meet Popat
# Configurable Docker images, replicas, and service ports.

frontend:
  replicaCount: 1

  image:
    repository: 404meet/swe645-frontend
    tag: "hw3-v1"
    pullPolicy: IfNotPresent

  service:
    port: 80
    nodePort: 30081

backend:
  replicaCount: 1

  image:
    repository: 404meet/swe645-backend
    tag: "hw3-v1"
    pullPolicy: IfNotPresent

  service:
    port: 8000

database:
  existingSecret: survey-db

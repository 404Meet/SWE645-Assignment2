# Meet Popat
# Exposes the React frontend through a Kubernetes NodePort Service.

apiVersion: v1
kind: Service
metadata:
  name: survey-frontend
spec:
  type: NodePort
  selector:
    app: survey-frontend
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: 80
      nodePort: {{ .Values.frontend.service.nodePort }}

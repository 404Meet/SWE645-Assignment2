# Author: Meet Rajesh Popat
# Purpose: Exposes the SWE 645 Kubernetes Deployment externally through a stable NodePort service.

apiVersion: v1
kind: Service

metadata:
  name: swe645-web-service

spec:
  type: NodePort

  selector:
    app: swe645-web

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080